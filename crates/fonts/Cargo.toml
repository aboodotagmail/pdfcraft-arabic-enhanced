[package]
name = "pdfcraft-fonts"
description = "Font metrics and text encoding helpers for generated appearances (standard fonts, WinAnsi)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
# Glyph outlines of the bundled script font (typed signatures); already in the tree via egui.
skrifa = "0.44"
# OpenType shaping (Arabic joining forms, ligatures, marks); already in the tree via egui and
# built on the same read-fonts as skrifa 0.44.
harfrust = "0.12"
# Unicode bidirectional algorithm (UAX #9) for right-to-left and mixed-direction lines.
unicode-bidi = "0.3"
unicode-normalization = "0.1"
